<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carteira do Casal</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
 <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --input-bg: #f8fafc;
      --accent: #10b981;
      --accent-hover: #059669;
      --blue: #3b82f6;
      --danger: #ef4444;
      --tab-bg: #e2e8f0;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --input-bg: #0f172a;
      --accent: #34d399;
      --accent-hover: #10b981;
      --blue: #60a5fa;
      --danger: #f87171;
      --tab-bg: #1e293b;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 18px 16px 32px;
      max-width: 480px;
      margin: 0 auto;
      transition: background-color 0.25s, color 0.25s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .logo-titulo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .controles-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #btn-tema {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background-color 0.25s;
    }

    #btn-tema:active {
      transform: scale(0.94);
    }

    header select {
      height: 38px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .abas {
      display: flex;
      gap: 6px;
      background: var(--tab-bg);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .abas button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .abas button.ativo {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    section {
      background: var(--card);
      padding: 18px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      transition: background-color 0.25s, border-color 0.25s;
    }

    h2 {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #total-hoje {
      display: block;
      font-size: 2.15rem;
      font-weight: 800;
      color: var(--accent);
      margin-top: 4px;
      letter-spacing: -0.03em;
    }

    #total-mes {
      display: block;
      font-size: 2.15rem;
      font-weight: 800;
      color: var(--blue);
      margin-top: 4px;
      letter-spacing: -0.03em;
    }

    h3 {
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: var(--text);
      font-weight: 600;
    }

    input, section select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: var(--input-bg);
      color: var(--text);
      transition: border-color 0.2s;
    }

    input:focus, section select:focus {
      outline: none;
      border-color: var(--accent);
    }

    #btn-salvar {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s, background-color 0.2s;
    }

    #btn-salvar:active {
      background-color: var(--accent-hover);
      transform: scale(0.98);
    }

    #lista-gastos, #resumo-categorias, #lista-mes {
      list-style: none;
    }

    #lista-gastos li, #resumo-categorias li, #lista-mes li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      gap: 10px;
    }

    #lista-gastos li:last-child,
    #resumo-categorias li:last-child,
    #lista-mes li:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }

    #lista-gastos button {
      background-color: rgba(239, 68, 68, 0.14);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 8px;
      padding: 6px 10px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>


<body>
  <header>
    <div class="logo-titulo">
      <img src="logo.png" alt="Logo" class="logo">
      <h1>Carteira do Casal</h1>
    </div>
    <div class="controles-header">
      <button id="btn-tema" onclick="alternarTema()" title="Alternar tema">🌙</button>
      <select id="usuario">
        <option value="Gabriel">Gabriel</option>
        <option value="Rhillainy">Rhillainy</option>
      </select>
    </div>
  </header>

  <main>
    <main>
    <div class="abas">
      <button id="tab-hoje" class="ativo" onclick="trocarAba('hoje')">Hoje</button>
      <button id="tab-mes" onclick="trocarAba('mes')">Este Mês</button>
    </div>

    <!-- ABA HOJE (seu código atual fica aqui dentro) -->
    <div id="aba-hoje">
      <section>
        <h2>Total de Hoje: <span id="total-hoje">R$ 0,00</span></h2>
      </section>

      <section>
        <h3>Novo Gasto</h3>
        <input type="number" id="valor" placeholder="Valor (ex: 45.50)" step="0.01">
        <select id="categoria">
          <option value="Mercado">Mercado</option>
          <option value="Farmácia">Farmácia</option>
          <option value="Combustível">Combustível</option>
          <option value="Lanche">Lanche</option>
          <option value="Casa">Casa</option>
          <option value="Outros">Outros</option>
        </select>
        <input type="text" id="descricao" placeholder="O que comprou? (opcional)">
        <button id="btn-salvar">Salvar Gasto</button>
      </section>

      <section>
        <h3>Gastos de Hoje</h3>
        <ul id="lista-gastos"></ul>
      </section>
    </div>

    <!-- ABA MÊS (nova) -->
    <div id="aba-mes" style="display: none;">
      <section>
        <h2>Total do Mês: <span id="total-mes">R$ 0,00</span></h2>
      </section>

      <section>
        <h3>Por Categoria</h3>
        <ul id="resumo-categorias"></ul>
      </section>

      <section>
        <h3>Histórico do Mês</h3>
        <ul id="lista-mes"></ul>
      </section>
    </div>
  
  <!-- 1. Importa a biblioteca oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // 2. Conecta com o seu banco de dados
    const SUPABASE_URL = 'https://pwsmmqlidxrpsjxyhxif.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3c21tcWxpZHhycHNqeHloeGlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2NDY1ODQsImV4cCI6MjExMTIyMjU4NH0.H4mb6I8aAV8j0YChwO29rpyS7ubkaygEid6ABO5zabA';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 3. Pega o botão da tela pelo ID e escuta o clique
    const btnSalvar = document.getElementById('btn-salvar');

    btnSalvar.addEventListener('click', async () => {
      const quem = document.getElementById('usuario').value;
      const valor = parseFloat(document.getElementById('valor').value);
      const categoria = document.getElementById('categoria').value;
      const descricao = document.getElementById('descricao').value;

      // Validação simples para não salvar vazio
      if (!valor || valor <= 0) {
        alert('Digite um valor válido!');
        return;
      }

      // 4. Envia os dados para a tabela "gastos" no Supabase
      const { error } = await db
        .from('gastos')
        .insert([{ quem, valor, categoria, descricao }]);

      if (error) {
        alert('Erro ao salvar: ' + error.message);
      } else {
        alert('Gasto salvo com sucesso!');
        document.getElementById('valor').value = '';
        document.getElementById('descricao').value = '';
      }
    });
    // 5. Função que busca e mostra apenas os gastos de HOJE
    async function carregarGastosHoje() {
      // Pega o início do dia de hoje no horário local (00:00:00)
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);

      // Busca no Supabase tudo o que foi criado de hoje 00:00 em diante
      const { data, error } = await db
        .from('gastos')
        .select('*')
        .gte('criado_em', hoje.toISOString())
        .order('criado_em', { ascending: false });

      if (error) {
        console.error('Erro ao buscar:', error.message);
        return;
      }

      const lista = document.getElementById('lista-gastos');
      const totalSpan = document.getElementById('total-hoje');
      lista.innerHTML = ''; // Limpa a lista antes de redesenhar
      let soma = 0;

      // Passa por cada gasto retornado do banco
      data.forEach((gasto) => {
        soma += Number(gasto.valor);

        const item = document.createElement('li');
        item.innerHTML = `${gasto.quem} • ${gasto.categoria} — R$ ${Number(gasto.valor).toFixed(2)} <button onclick="excluirGasto(${gasto.id})">X</button>(${gasto.descricao || 'sem descrição'})`;
        lista.appendChild(item);
      });

      // Atualiza o total lá no topo da tela
      totalSpan.textContent = `R$ ${soma.toFixed(2)}`;
    }

    // 6. Ouvinte em Tempo Real: atualiza a tela na hora se você ou a Rhillainy salvarem algo
    db.channel('canal-gastos')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'gastos' }, () => {
        carregarGastosHoje();
      })
      .subscribe();

    // 7. Carrega os gastos assim que a página abre
    carregarGastosHoje();
    // 8. Apaga um gasto pelo ID no Supabase
    async function excluirGasto(id) {
      if (!confirm('Apagar este gasto?')) return;

      const { error } = await db
        .from('gastos')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Erro ao apagar: ' + error.message);
      }
    }
    // Lembrar usuário selecionado no aparelho
    const selectUsuario = document.getElementById('usuario');
    const usuarioSalvo = localStorage.getItem('usuario_carteira');

    if (usuarioSalvo) {
      selectUsuario.value = usuarioSalvo;
    }

    selectUsuario.addEventListener('change', () => {
      localStorage.setItem('usuario_carteira', selectUsuario.value);
    });
    
  </script>
  <script>
    // 9. Trocar entre as abas Hoje e Mês
    function trocarAba(aba) {
      document.getElementById('aba-hoje').style.display = aba === 'hoje' ? 'block' : 'none';
      document.getElementById('aba-mes').style.display = aba === 'mes' ? 'block' : 'none';

      document.getElementById('tab-hoje').classList.toggle('ativo', aba === 'hoje');
      document.getElementById('tab-mes').classList.toggle('ativo', aba === 'mes');

      if (aba === 'mes') {
        carregarGastosMes();
      }
    }

    // 10. Buscar todos os gastos do mês atual
    async function carregarGastosMes() {
      const agora = new Date();
      const inicioMes = new Date(agora.getFullYear(), agora.getMonth(), 1);

      const { data, error } = await db
        .from('gastos')
        .select('*')
        .gte('criado_em', inicioMes.toISOString())
        .order('criado_em', { ascending: false });

      if (error) {
        console.error('Erro ao buscar mês:', error.message);
        return;
      }

      let totalMes = 0;
      const porCategoria = {};
      const listaMes = document.getElementById('lista-mes');
      listaMes.innerHTML = '';

      data.forEach((gasto) => {
        const valor = Number(gasto.valor);
        totalMes += valor;
        porCategoria[gasto.categoria] = (porCategoria[gasto.categoria] || 0) + valor;

        const dia = new Date(gasto.criado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
        const item = document.createElement('li');
        item.innerHTML = `<span>${dia} • ${gasto.quem} (${gasto.categoria})</span> <strong>R$ ${valor.toFixed(2)}</strong>`;
        listaMes.appendChild(item);
      });

      document.getElementById('total-mes').textContent = `R$ ${totalMes.toFixed(2)}`;

      const ulCat = document.getElementById('resumo-categorias');
      ulCat.innerHTML = '';
      for (const [cat, total] of Object.entries(porCategoria)) {
        const li = document.createElement('li');
        li.innerHTML = `<span>${cat}</span> <strong>R$ ${total.toFixed(2)}</strong>`;
        ulCat.appendChild(li);
      }
    }
    // 11. Modo Noturno com memória local
    const btnTema = document.getElementById('btn-tema');

    if (localStorage.getItem('tema_carteira') === 'dark') {
      document.body.classList.add('dark');
      btnTema.textContent = '☀️';
    }

    function alternarTema() {
      const escuro = document.body.classList.toggle('dark');
      localStorage.setItem('tema_carteira', escuro ? 'dark' : 'light');
      btnTema.textContent = escuro ? '☀️' : '🌙';
    }
  </script>
</body>
